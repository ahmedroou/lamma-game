name: lamma
description: 'An Arabic Flutter game-night app with an adaptive gaming home and local prototype.'
publish_to: 'none'
version: 0.2.5+7
environment:
  sdk: ^3.11.5
dependencies:
  crypto: 3.0.7
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.7
  sembast_web: ^2.4.4
  url_launcher: ^6.3.3
  audioplayers: ^6.7.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/category_art/
    - assets/questions/
    - assets/question_media/
    - assets/question_audio/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
